name: iOS CI

on:
  push:
    branches: [ develop, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
            xcode-version: latest-stable
      - name: List available simulators
        run: xcrun simctl list
      - name: Create and boot simulator
        run: |
              UDID=$(xcrun simctl create TestDevice com.apple.CoreSimulator.SimDeviceType.iPhone-14 com.apple.CoreSimulator.SimRuntime.iOS-17-0)
              xcrun simctl boot $UDID
              echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
      - name: Build and test
        run: |
              xcodebuild test \
                -project TestApp4.xcodeproj \
                -scheme TestApp4 \
                -destination "platform=iOS Simulator,id=${{ env.SIMULATOR_UDID }}"
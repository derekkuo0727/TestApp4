name: iOS CI

on:
  push:
    branches: [ develop, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          brew install swiftlint || true
      - name: Build and test
        run: |
          xcodebuild test \
            -scheme TestApp4 \
            -destination 'platform=iOS Simulator,name=iPhone 15'